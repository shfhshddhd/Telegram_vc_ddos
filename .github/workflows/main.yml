name: Run Telegram VC DDoS

on:
  workflow_dispatch:          # Manual trigger from Actions tab
  schedule:
    - cron: '0 */6 * * *'    # Every 6 hours (optional, tu change kar sakta hai)

jobs:
  run-ddos:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # Max 6 hours job (GitHub limit)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f setup.py ]; then pip install .; fi

      - name: Run main script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          TARGET_GROUP: ${{ secrets.TARGET_GROUP }}
          # Yahan apne env variables add kar le jo script me use hote hain
        run: |
          python main.py
